name: super_app_rw
description: Aplikasi koordinasi, keamanan, dan administrasi warga RW.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# Versi memakai "any" agar otomatis cocok dengan Flutter terbaru di awal proyek.
# Setelah `flutter pub get`, kunci versi di pubspec.lock (jangan di-ignore).
dependencies:
  flutter:
    sdk: flutter
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  url_launcher: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
